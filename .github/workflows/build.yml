name: Build AirportRtw88Legacy

on:
  push:
    branches: [ main, exp44-uplink-all-fixes ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout AirportRtw88
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: AirportRtw88

      - name: Clone rtw88-stable
        run: |
          git clone --branch feixiao https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3

      - name: Apply the exp40 macOS port patches
        run: git -C rtw88-stable apply --check ../AirportRtw88/patches/rtw88-exp40-macos-port.patch && git -C rtw88-stable apply ../AirportRtw88/patches/rtw88-exp40-macos-port.patch

      - name: Apply integrated exp44 safe uplink fixes
        run: python3 AirportRtw88/scripts/apply_exp44_uplink_all.py AirportRtw88 rtw88-stable

      - name: Download firmware blobs
        run: |
          cd AirportRtw88/firmware
          for fw in rtw8821c_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -sLO "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done
          ls -lh *.bin

      - name: Build MacKernelSDK runtime libraries
        working-directory: AirportRtw88
        run: |
          mkdir -p MacKernelSDK/Library/x86_64 MacKernelSDK/Library/universal build-macksdk
          common_flags=(-mkernel -arch x86_64 -mmacosx-version-min=11.0 -isysroot "$(xcrun --sdk macosx --show-sdk-path)" -I MacKernelSDK/Headers -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT -DTARGET_OS_OSX)
          xcrun clang "${common_flags[@]}" -c MacKernelSDK/Library/kmod/c_start.c -o build-macksdk/c_start.o
          xcrun clang "${common_flags[@]}" -c MacKernelSDK/Library/kmod/c_stop.c -o build-macksdk/c_stop.o
          xcrun clang "${common_flags[@]}" -c MacKernelSDK/Library/kmod/cplus_start.c -o build-macksdk/cplus_start.o
          xcrun clang "${common_flags[@]}" -c MacKernelSDK/Library/kmod/cplus_stop.c -o build-macksdk/cplus_stop.o
          xcrun ar rcs MacKernelSDK/Library/x86_64/libkmod.a build-macksdk/c_start.o build-macksdk/c_stop.o
          xcrun ar rcs MacKernelSDK/Library/universal/libkmodc++.a build-macksdk/cplus_start.o build-macksdk/cplus_stop.o

      - name: Build native legacy kext
        run: make FLAVOR=airport-legacy kext
        working-directory: AirportRtw88

      - name: Get git hash and kext UUID
        id: ids
        run: |
          echo "hash=$(git -C AirportRtw88 rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "uuid=$(dwarfdump --uuid AirportRtw88/build-airport-legacy/out/AirportRtw88Legacy.kext/Contents/MacOS/AirportRtw88Legacy | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Create artifact zip
        run: |
          cd AirportRtw88/build-airport-legacy/out
          zip -r "${{ runner.temp }}/AirportRtw88Legacy_exp44_${{ steps.ids.outputs.hash }}_${{ steps.ids.outputs.uuid }}.zip" AirportRtw88Legacy.kext

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirportRtw88Legacy_exp44_${{ steps.ids.outputs.hash }}_${{ steps.ids.outputs.uuid }}
          path: ${{ runner.temp }}/AirportRtw88Legacy_exp44_${{ steps.ids.outputs.hash }}_${{ steps.ids.outputs.uuid }}.zip
